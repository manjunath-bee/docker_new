apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: mssql
  labels:
    app: mssql
    version: "2022"
spec:
  serviceName: mssql-service
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
        version: "2022"
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: mssql-sa
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      # Init container fetches secrets from AWS Secrets Manager using IRSA
      # Falls back to K8s secret if IRSA is not yet configured
      initContainers:
      - name: fetch-secrets
        image: amazon/aws-cli:latest
        command: ["sh", "-c"]
        args:
        - |
          # Try AWS Secrets Manager first (IRSA)
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id mssql/sa-password \
            --region us-east-1 \
            --query SecretString \
            --output text 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$SECRET" ]; then
            echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); open('/secrets/username','w').write(d['username']); open('/secrets/password','w').write(d['password'])"
            echo "Password fetched from AWS Secrets Manager"
          elif [ -f /k8s-secret/password ]; then
            cp /k8s-secret/password /secrets/password
            echo "sa" > /secrets/username
            echo "Password fetched from K8s secret (fallback)"
          else
            echo "ERROR: No password source available"
            exit 1
          fi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
        - name: k8s-secret
          mountPath: /k8s-secret
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0       # AWS CLI needs root in init container
          runAsNonRoot: false
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: mssql
          protocol: TCP
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Enterprise"
        - name: MSSQL_DATA_DIR
          value: "/var/opt/mssql/data"
        - name: MSSQL_LOG_DIR
          value: "/var/opt/mssql/log"
        - name: MSSQL_BACKUP_DIR
          value: "/var/opt/mssql/backup"
        - name: MSSQL_AGENT_ENABLED
          value: "true"
        - name: MSSQL_MEMORY_LIMIT_MB
          value: "3072"
        # SA_PASSWORD is read from the file written by init container
        command: ["sh", "-c"]
        args:
        - |
          export MSSQL_SA_PASSWORD=$(cat /secrets/password)
          /opt/mssql/bin/sqlservr
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql/data
        - name: mssql-log
          mountPath: /var/opt/mssql/log
        - name: mssql-backup
          mountPath: /var/opt/mssql/backup
        - name: mssql-config
          mountPath: /var/opt/mssql/mssql.conf
          subPath: mssql.conf
        - name: secrets
          mountPath: /secrets
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: mssql-config
        configMap:
          name: mssql-config
      - name: secrets
        emptyDir:
          medium: Memory    # tmpfs - secrets never written to disk
      - name: k8s-secret
        secret:
          secretName: mssql-sa-password
          optional: true    # Won't block pod if secret doesn't exist
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "mssql"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mssql
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
      labels:
        app: mssql
        volume-type: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 50Gi
  - metadata:
      name: mssql-log
      labels:
        app: mssql
        volume-type: log
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: mssql-backup
      labels:
        app: mssql
        volume-type: backup
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 50Gi
