apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader        # Add this
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods       # Add this
subjects:
- kind: User
  name: Sudheer
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
