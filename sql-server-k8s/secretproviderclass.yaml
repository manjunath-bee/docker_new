apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mssql-secret
  namespace: mssql
  labels:
    app: mssql
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "mssql/sa-password"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: password
          - path: username
            objectAlias: username
