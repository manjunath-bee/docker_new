# SQL Server Configuration
mssql:
  image: mcr.microsoft.com/mssql/server
  tag: "2022-latest"
  pid: "Enterprise"           # Developer, Express, Standard, Enterprise
  agentEnabled: true
  memoryLimitMB: 3072

# AWS Configuration
aws:
  region: us-east-1
  accountId: "856678556116"
  secretName: mssql/sa-password    # Secret in AWS Secrets Manager
  irsaRoleArn: arn:aws:iam::856678556116:role/mssql-secrets-role

# Service Account
serviceAccount:
  create: false   # Set to false when using eksctl create iamserviceaccount
  name: mssql-sa

# Service (NLB for external access)
service:
  scheme: internal              # "internal" for VPC-only, "internet-facing" for public
  subnetIds: ""                 # Optional: comma-separated subnet IDs for NLB placement

# Resources
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

# Storage
storage:
  create: true              # Set to false if StorageClass already exists
  className: mssql-storage
  provisioner: ebs.csi.aws.com
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
  data:
    size: 50Gi
  log:
    size: 20Gi
  backup:
    size: 50Gi

# Network Policy
networkPolicy:
  enabled: true

# Pod Disruption Budget
pdb:
  enabled: true
  minAvailable: 1

# Node placement
nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: "database"
    operator: "Equal"
    value: "mssql"
    effect: "NoSchedule"

# SQL Server mssql.conf settings
config:
  tlsProtocols: "1.2"
  forceEncryption: 1
  telemetry: false
  traceFlags:
    - 3226    # Suppress backup log entries
    - 1222    # Deadlock detection
