apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: expense
spec:
  serviceAccountName: aws-service-account
  volumes:
  - name: secrets
    emptyDir: {}
  initContainers:
  - name: fetch-secrets
    image: amazon/aws-cli:latest
    command: ["sh", "-c"]
    args:
    - |
      aws secretsmanager get-secret-value \
        --secret-id mysqlrds \
        --region us-east-1 \
        --query SecretString \
        --output text > /secrets/credentials.json
    volumeMounts:
    - name: secrets
      mountPath: /secrets
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: secrets
      mountPath: /mnt/secrets
      readOnly: true

