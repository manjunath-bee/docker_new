apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  nodeSelector:
    topology.kubernetes.io/zone=us-east-1d
  containers:
  - name: app
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-claim