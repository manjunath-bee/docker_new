networks:
  # The presence of these objects is sufficient to define them
  expense: {}

volumes:
  mysql:

services:
  mysql:
    image: mysql:1.0.0
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - expense
    container_name: mysql

  backend:
   image: backend:1.0.0
   command: sh -c "sleep 10 && node /opt/backend/index.js"
   networks:
    - expense
   container_name: backend
   depends_on:
    - mysql
 
  frontend:
   image: frontend:1.0.0
   networks:
    - expense
   ports:
    - 80:80
   container_name: frontend
   depends_on:
    - backend