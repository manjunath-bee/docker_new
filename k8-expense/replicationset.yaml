apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nginx
  Namespace: expense
  labels:
    app: nginx
    tier: web
spec:
  # modify replicas according to your case
  replicas: 1
  selector:
    matchLabels:
      app: nginx
      tier: web
  template:
    metadata:
      Namespace: expense
      labels:
        app: nginx
        tier: web
    spec:
      containers:
      - name: nginx
        image: nginx