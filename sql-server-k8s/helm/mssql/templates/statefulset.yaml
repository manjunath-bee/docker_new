apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mssql.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mssql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mssql.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "mssql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      initContainers:
      - name: fetch-secrets
        image: amazon/aws-cli:latest
        command: ["sh", "-c"]
        args:
        - |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id {{ .Values.aws.secretName }} \
            --region {{ .Values.aws.region }} \
            --query SecretString \
            --output text 2>/dev/null)
          if [ $? -eq 0 ] && [ -n "$SECRET" ]; then
            echo "$SECRET" | python3 -c "import sys,json; d=json.load(sys.stdin); open('/secrets/username','w').write(d['username']); open('/secrets/password','w').write(d['password'])"
            echo "Password fetched from AWS Secrets Manager"
          elif [ -f /k8s-secret/password ]; then
            cp /k8s-secret/password /secrets/password
            echo "sa" > /secrets/username
            echo "Password fetched from K8s secret (fallback)"
          else
            echo "ERROR: No password source available"
            exit 1
          fi
        volumeMounts:
        - name: secrets
          mountPath: /secrets
        - name: k8s-secret
          mountPath: /k8s-secret
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
          runAsNonRoot: false
      containers:
      - name: mssql
        image: {{ .Values.mssql.image }}:{{ .Values.mssql.tag }}
        ports:
        - containerPort: 1433
          name: mssql
          protocol: TCP
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: {{ .Values.mssql.pid | quote }}
        - name: MSSQL_DATA_DIR
          value: "/var/opt/mssql/data"
        - name: MSSQL_LOG_DIR
          value: "/var/opt/mssql/log"
        - name: MSSQL_BACKUP_DIR
          value: "/var/opt/mssql/backup"
        - name: MSSQL_AGENT_ENABLED
          value: {{ .Values.mssql.agentEnabled | quote }}
        - name: MSSQL_MEMORY_LIMIT_MB
          value: {{ .Values.mssql.memoryLimitMB | quote }}
        command: ["sh", "-c"]
        args:
        - |
          export MSSQL_SA_PASSWORD=$(cat /secrets/password)
          /opt/mssql/bin/sqlservr
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql/data
        - name: mssql-log
          mountPath: /var/opt/mssql/log
        - name: mssql-backup
          mountPath: /var/opt/mssql/backup
        - name: mssql-config
          mountPath: /var/opt/mssql/mssql.conf
          subPath: mssql.conf
        - name: secrets
          mountPath: /secrets
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: mssql-config
        configMap:
          name: {{ include "mssql.fullname" . }}-config
      - name: secrets
        emptyDir:
          medium: Memory
      - name: k8s-secret
        secret:
          secretName: mssql-sa-password
          optional: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - {{ .Chart.Name }}
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.data.size }}
  - metadata:
      name: mssql-log
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: log
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.log.size }}
  - metadata:
      name: mssql-backup
      labels:
        {{- include "mssql.selectorLabels" . | nindent 8 }}
        volume-type: backup
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: {{ .Values.storage.className }}
      resources:
        requests:
          storage: {{ .Values.storage.backup.size }}
