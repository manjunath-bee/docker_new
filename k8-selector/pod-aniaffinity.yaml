apiVersion: v1
kind: Pod
metadata:
  name: with-pod-affinity-1
  labels:
    app: pod-1
spec:
  containers:
    - name: with-pod-affinity
      image: registry.k8s.io/pause:3.8
---
apiVersion: v1
kind: Pod
metadata:
  name: with-pod-affinity-2
  labels:
    app: pod-2
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - pod-1
          topologyKey: topology.kubernetes.io/zone
  containers:
    - name: with-pod-affinity
      image: registry.k8s.io/pause:3.8
