---
# Headless service (required for StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: mssql-service
  namespace: mssql
  labels:
    app: mssql
spec:
  type: ClusterIP
  clusterIP: None           # Headless - required for StatefulSet
  selector:
    app: mssql
  ports:
  - protocol: TCP
    port: 1433
    targetPort: 1433
    name: mssql
---
# Regular ClusterIP service for application connections
apiVersion: v1
kind: Service
metadata:
  name: mssql
  namespace: mssql
  labels:
    app: mssql
spec:
  type: ClusterIP
  selector:
    app: mssql
  ports:
  - protocol: TCP
    port: 1433
    targetPort: 1433
    name: mssql
