apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: expense
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: manjudbadevops/frontend:1.0.0
---
apiVersion: v1
kind: Service
metadata:
  namespace: expense
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80