apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
  namespace: mssql
  labels:
    app: mssql
    version: "2022"
spec:
  serviceName: mssql-service
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
        version: "2022"
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: mssql-sa
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: mssql
          protocol: TCP
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Enterprise"
        - name: MSSQL_DATA_DIR
          value: "/var/opt/mssql/data"
        - name: MSSQL_LOG_DIR
          value: "/var/opt/mssql/log"
        - name: MSSQL_BACKUP_DIR
          value: "/var/opt/mssql/backup"
        - name: MSSQL_AGENT_ENABLED
          value: "true"
        - name: MSSQL_MEMORY_LIMIT_MB
          value: "3072"
        # SA_PASSWORD read from CSI-mounted secret file
        command: ["sh", "-c"]
        args:
        - |
          export MSSQL_SA_PASSWORD=$(cat /mnt/secrets/password)
          /opt/mssql/bin/sqlservr
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql/data
        - name: mssql-log
          mountPath: /var/opt/mssql/log
        - name: mssql-backup
          mountPath: /var/opt/mssql/backup
        - name: mssql-config
          mountPath: /var/opt/mssql/mssql.conf
          subPath: mssql.conf
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 1433
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: mssql-config
        configMap:
          name: mssql-config
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: mssql-secret
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "database"
        operator: "Equal"
        value: "mssql"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - mssql
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
      labels:
        app: mssql
        volume-type: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 50Gi
  - metadata:
      name: mssql-log
      labels:
        app: mssql
        volume-type: log
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 20Gi
  - metadata:
      name: mssql-backup
      labels:
        app: mssql
        volume-type: backup
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: mssql-storage
      resources:
        requests:
          storage: 50Gi
